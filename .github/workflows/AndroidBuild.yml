name: AndroidBuild
on:
  pull_request:
    branches: [ clean-architecture ]
  push :
    branches: [ clean-architecture ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Unsigned APK Debug Paid Variant with Gradle
        run: ./gradlew assemblePaidDebug

      - name: Build Unsigned APK Debug Free Variant with Gradle
        run: ./gradlew assembleFreeDebug

      - name: Build Android Bundle (.aab) Release Free Variant
        run: ./gradlew bundleFreeRelease

      - name: Build Android Bundle (.aab) Release Paid Variant
        run: ./gradlew bundlePaidRelease

      - uses: r0adkll/sign-android-release@v1
        name: Sign Android Bundle (.aab) Release Free Variant
        # ID used to access action output
        id: sign_aab_free_release
        with:
          releaseDirectory: app/build/outputs/bundle/free/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (33.0.0) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      - uses: r0adkll/sign-android-release@v1
        name: Sign Android Bundle (.aab) Release Paid Variant
        # ID used to access action output
        id: sign_aab_paid_release
        with:
          releaseDirectory: app/build/outputs/bundle/paid/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # override default build-tools version (33.0.0) -- optional
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload APK of Debug Paid Variant Build
        uses: actions/upload-artifact@v4.3.3
        with:
          name: debug_paid_build_unsigned.apk
          path: app/build/outputs/apk/paid/debug/app-paid-debug.apk

      - name: Upload APK of Debug Free Variant Build
        uses: actions/upload-artifact@v4.3.3
        with:
          name: debug_free_build_unsigned.apk
          path: app/build/outputs/apk/free/debug/app-free-debug.apk






