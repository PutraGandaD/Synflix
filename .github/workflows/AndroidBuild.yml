name: AndroidBuild
on:
  pull_request:
    branches: [ clean-architecture ]
  push :
    branches: [ clean-architecture ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_STORE_PATH: ${{ secrets.SIGNING_KEY_STORE_PATH }}

        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > $SIGNING_KEY_STORE_PATH

      - name: Build Unsigned APK Debug Paid Variant with Gradle
        run: ./gradlew assemblePaidDebug

      - name: Build Unsigned APK Debug Free Variant with Gradle
        run: ./gradlew assembleFreeDebug

      - name: Build Android Bundle (.aab) Release Free Variant
        env:
          SIGNING_KEY_STORE_PATH: ${{ secrets.SIGNING_KEY_STORE_PATH }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew bundleFreeRelease

      - name: Build Android Bundle (.aab) Release Paid Variant
        env:
          SIGNING_KEY_STORE_PATH: ${{ secrets.SIGNING_KEY_STORE_PATH }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew bundlePaidRelease

      - name: Move Free Variant AAB to Release Directory
        run: mkdir -p app/free/release && mv app/build/outputs/bundle/freeRelease/*.aab app/free/release/

      - name: Move Paid Variant AAB to Release Directory
        run: mkdir -p app/paid/release && mv app/build/outputs/bundle/paidRelease/*.aab app/paid/release/

      - name: Upload APK of Debug Paid Variant Build
        uses: actions/upload-artifact@v4.3.3
        with:
          name: debug_paid_build_unsigned.apk
          path: app/build/outputs/apk/paid/debug/app-paid-debug.apk

      - name: Upload APK of Debug Free Variant Build
        uses: actions/upload-artifact@v4.3.3
        with:
          name: debug_free_build_unsigned.apk
          path: app/build/outputs/apk/free/debug/app-free-debug.apk

      - name: Upload .aab Release
        uses: actions/upload-artifact@v4.3.3
        with:
          name: release-artifacts
          path: |
            app/free/release/
            app/paid/release/






