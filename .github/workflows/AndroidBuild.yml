name: AndroidBuild
on:
  pull_request:
    branches: [ clean-architecture ]
  push :
    branches: [ clean-architecture ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup Java JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug Paid Variant with Gradle
        run: ./gradlew assemblePaidDebug

      - name: Build Debug Free Variant with Gradle
        run: ./gradlew assembleFreeDebug

      - name: Upload APK of Debug Paid Variant Build
        uses: actions/upload-artifact@v4.3.3
        with:
          name: debug_paid_build.apk
          path: app/build/outputs/apk/paid/debug/app-paid-debug.apk

      - name: Upload APK of Debug Free Variant Build
        uses: actions/upload-artifact@v4.3.3
        with:
          name: debug_free_build.apk
          path: app/build/outputs/apk/free/debug/app-free-debug.apk



